<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque de Rolos</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#1f2937
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px
}

h1{
  margin:0 0 6px
}

h2{
  margin-top:0
}

.subtitle{
  margin:0 0 20px;
  color:#6b7280
}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #0001
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin-bottom:6px
}

input,
select,
button{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:16px
}

button{
  border:0;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
  cursor:pointer
}

button:disabled{
  opacity:.6;
  cursor:wait
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:16px
}

.stat{
  background:#eef2ff;
  border-radius:12px;
  padding:16px
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:4px
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px
}

.tab{
  background:#e5e7eb;
  color:#374151
}

.tab.active{
  background:#2563eb;
  color:#fff
}

.roll{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb
}

.roll:last-child{
  border-bottom:0
}

.roll-info{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0
}

.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  border:1px solid #aaa;
  flex:none
}

.name{
  font-weight:bold
}

.meters{
  font-size:20px;
  font-weight:bold;
  white-space:nowrap
}

.delete{
  width:auto;
  padding:9px 12px;
  background:#dc2626;
  font-size:14px
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:25px
}

.count{
  color:#6b7280;
  font-size:14px;
  margin-top:8px
}

.date{
  color:#6b7280;
  font-size:13px;
  margin-top:4px
}

.saida-date{
  color:#dc2626;
  font-size:13px;
  margin-top:4px
}

.resumo-tabela{
  width:100%;
  border-collapse:collapse;
  margin-top:12px
}

.resumo-tabela th,
.resumo-tabela td{
  padding:12px 8px;
  text-align:left;
  border-bottom:1px solid #e5e7eb
}

.resumo-tabela th{
  font-size:14px;
  color:#6b7280
}

.tipo-resumo{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:bold
}

.tipo-resumo .dot{
  width:14px;
  height:14px
}

.total-tipo{
  font-weight:bold;
  white-space:nowrap
}

.status{
  font-size:13px;
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:#f3f4f6;
  color:#4b5563
}

.status.ok{
  background:#ecfdf5;
  color:#047857
}

.status.erro{
  background:#fef2f2;
  color:#b91c1c
}

.small{
  font-size:12px;
  color:#6b7280;
  margin-top:8px;
  line-height:1.4
}

@media(max-width:650px){

  .form,
  .filters{
    grid-template-columns:1fr
  }

  .roll{
    align-items:flex-start;
    flex-direction:column
  }

  .roll-action{
    width:100%
  }

  .roll-action button{
    width:100%
  }

  .resumo-tabela th,
  .resumo-tabela td{
    padding:10px 5px;
    font-size:14px
  }
}
</style>
</head>

<body>

<div class="container">

<!-- CABEÇALHO -->

<div class="card">

<h1>📦 Estoque de Rolos</h1>

<p class="subtitle">
Controle suas metragens, cores, entradas e saídas.
</p>

<div class="form">

<div>

<label for="tipo">
Tipo / Cor
</label>

<select id="tipo">

<option>Preto liso</option>
<option>Preto texturado</option>
<option>Golden</option>
<option>Nogueira</option>
<option>Bronze</option>
<option>Pirita</option>
<option>Grafite</option>

</select>

</div>

<div>

<label for="metragem">
Metragem (m)
</label>

<input
id="metragem"
type="number"
min="0"
step="0.01"
placeholder="Ex.: 530"
>

</div>

<div style="align-self:end">

<button id="add">
➕ Adicionar rolo
</button>

</div>

</div>

</div>


<!-- ESTATÍSTICAS -->

<div class="stats">

<div class="stat">

📦 Rolos no estoque

<strong id="totalRolos">
0
</strong>

</div>

<div class="stat">

📏 Metros no estoque

<strong id="totalMetros">
0 m
</strong>

</div>

</div>


<!-- ABAS -->

<div class="tabs">

<button
id="btnEntrada"
class="tab active"
>
📥 Entrada
</button>

<button
id="btnSaida"
class="tab"
>
📤 Saída
</button>

</div>


<!-- BUSCA -->

<div class="card">

<h2>
🔎 Buscar
</h2>

<div class="filters">

<input
id="buscaMetragem"
type="number"
min="0"
step="0.01"
placeholder="Buscar por metragem..."
>

<select id="filtroTipo">

<option value="">
Todas as cores
</option>

<option>Preto liso</option>
<option>Preto texturado</option>
<option>Golden</option>
<option>Nogueira</option>
<option>Bronze</option>
<option>Pirita</option>
<option>Grafite</option>

</select>

</div>

</div>


<!-- LISTA -->

<div class="card">

<h2 id="tituloLista">
📥 Rolos no estoque
</h2>

<div id="lista"></div>

<div
class="count"
id="count">
</div>

</div>


<!-- RESUMO -->

<div class="card">

<h2>
📊 Resumo por tipo
</h2>

<table class="resumo-tabela">

<thead>

<tr>

<th>
Tipo
</th>

<th>
Rolos
</th>

<th>
Metragem total
</th>

</tr>

</thead>

<tbody id="resumoTipos">
</tbody>

</table>

</div>


<!-- SUPABASE -->

<div class="card">

<h2>
☁️ Estoque compartilhado
</h2>

<button id="recarregar">
🔄 Recarregar do Supabase
</button>

<div
id="status"
class="status">
Conectando ao estoque...
</div>

<div class="small">

Os dados são salvos no banco de dados
<strong>Supabase</strong>.

</div>

</div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO DO SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://pipnkvlicwfraisywrzl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7v_jngycgXi9ZEqLYhFl8Q_FWwhcc_v";

const SUPABASE_TABLE =
"rolos";


/* =====================================================
   TIPOS
   ===================================================== */

const tipos = [

"Preto liso",
"Preto texturado",
"Golden",
"Nogueira",
"Bronze",
"Pirita",
"Grafite"

];


/* =====================================================
   CORES
   ===================================================== */

const cores = {

"Preto liso":"#111111",

"Preto texturado":"#333333",

"Golden":"#d4af37",

"Nogueira":"#6b4226",

"Bronze":"#cd7f32",

"Pirita":"#8b8b83",

"Grafite":"#555555"

};


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let rolos = [];

let abaAtual = "entrada";

let salvando = false;


/* =====================================================
   ELEMENTOS
   ===================================================== */

const tipo =
document.getElementById("tipo");

const metragem =
document.getElementById("metragem");

const buscaMetragem =
document.getElementById("buscaMetragem");

const filtroTipo =
document.getElementById("filtroTipo");

const lista =
document.getElementById("lista");

const resumoTipos =
document.getElementById("resumoTipos");

const statusEl =
document.getElementById("status");

const addBtn =
document.getElementById("add");


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(texto, classe=""){

statusEl.textContent = texto;

statusEl.className =
"status " + classe;

}


/* =====================================================
   CABEÇALHOS SUPABASE
   ===================================================== */

function supabaseHeaders(){

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Content-Type":
"application/json",

"Accept":
"application/json"

};

}


/* =====================================================
   REQUISIÇÃO SUPABASE
   ===================================================== */

async function supabaseRequest(
url,
options={}
){

const response =
await fetch(
url,
{
...options,

headers:{
...supabaseHeaders(),
...(options.headers || {})
}

}
);


let data = null;

try{

data =
await response.json();

}catch(e){}


if(!response.ok){

throw new Error(
data?.message ||
data?.error_description ||
data?.hint ||
`Erro HTTP ${response.status}`
);

}


return data;

}


/* =====================================================
   URL DA TABELA
   ===================================================== */

function tabelaUrl(){

return `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`;

}


/* =====================================================
   CARREGAR ROLOS
   ===================================================== */

async function carregarRolos(){

try{

setStatus(
"🔄 Carregando estoque do Supabase..."
);


const dados =
await supabaseRequest(
`${tabelaUrl()}?select=*`,
{
method:"GET"
}
);


rolos =
Array.isArray(dados)
? dados
: [];


setStatus(
`✅ Estoque atualizado. ${rolos.length} registro(s) carregado(s).`,
"ok"
);


render();


}catch(error){

console.error(error);

setStatus(
"❌ Erro ao carregar: " +
error.message,
"erro"
);

}

}


/* =====================================================
   ADICIONAR ROLO
   ===================================================== */

async function adicionar(){

const valor =
Number(
metragem.value
);


if(
!Number.isFinite(valor) ||
valor <= 0
){

alert(
"Digite uma metragem válida."
);

metragem.focus();

return;

}


if(salvando)
return;


salvando = true;

addBtn.disabled = true;


try{

setStatus(
"🔄 Salvando entrada no Supabase..."
);


/*
O banco gera o ID automaticamente.
*/

const novo = {

tipo:
tipo.value,

metragem:
valor,

entrada_em:
new Date().toISOString(),

saida_em:
null

};


const dados =
await supabaseRequest(
tabelaUrl(),
{

method:"POST",

headers:{
"Prefer":
"return=representation"
},

body:
JSON.stringify(novo)

}
);


if(
Array.isArray(dados) &&
dados.length
){

rolos.unshift(
dados[0]
);

}

else{

await carregarRolos();

}


metragem.value =
"";

metragem.focus();


setStatus(
"✅ Rolo adicionado ao estoque.",
"ok"
);


render();


}catch(error){

console.error(error);

setStatus(
"❌ Erro ao adicionar: " +
error.message,
"erro"
);

alert(
"Não foi possível adicionar o rolo.\n\n" +
error.message
);

}finally{

salvando = false;

addBtn.disabled = false;

}

}


/* =====================================================
   REGISTRAR SAÍDA
   ===================================================== */

async function registrarSaida(id){

const rolo =
rolos.find(
r => String(r.id) === String(id)
);

if(!rolo)
return;

const confirmar =
confirm(
`Registrar saída do rolo de ${formatarNumero(rolo.metragem)} m — ${rolo.tipo}?`
);

if(!confirmar)
return;

if(salvando)
return;

salvando = true;

try{

setStatus(
"🔄 Registrando saída no Supabase..."
);

const saidaEm =
new Date().toISOString();


/*
Atualiza diretamente o registro
no banco de dados.
*/

const resultado =
await supabaseRequest(
`${tabelaUrl()}?id=eq.${encodeURIComponent(id)}`,
{

method:"PATCH",

headers:{
"Prefer":"return=representation"
},

body:
JSON.stringify({

saida_em: saidaEm

})

}
);


/*
Confirma se o Supabase realmente
alterou o registro.
*/

if(
!Array.isArray(resultado) ||
resultado.length === 0
){

throw new Error(
"O Supabase não encontrou o rolo para atualizar."
);

}


/*
Agora buscamos novamente todos
os registros diretamente do banco.
*/

await carregarRolos();


setStatus(
"✅ Saída registrada com sucesso.",
"ok"
);


}catch(error){

console.error(error);

setStatus(
"❌ Erro ao registrar saída: " +
error.message,
"erro"
);

alert(
"Não foi possível registrar a saída.\n\n" +
error.message
);

}finally{

salvando = false;

}

}
```

/* =====================================================
   FORMATAÇÃO
   ===================================================== */

function formatarNumero(numero){

return Number.isInteger(Number(numero))

? String(numero)

: Number(numero).toLocaleString(
"pt-BR",
{
maximumFractionDigits:2
}
);

}


function formatarData(data){

if(!data)
return "—";


const d =
new Date(data);


if(isNaN(d.getTime()))
return "—";


return d.toLocaleString(
"pt-BR",
{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =====================================================
   RESUMO POR TIPO
   ===================================================== */

function renderResumo(){

const estoque =
rolos.filter(
r => !r.saida_em
);


resumoTipos.innerHTML =

tipos.map(
tipoAtual => {

const rolosTipo =
estoque.filter(
r => r.tipo === tipoAtual
);


const quantidade =
rolosTipo.length;


const metragemTotal =
rolosTipo.reduce(
(s,r) =>
s + Number(r.metragem),
0
);


return `

<tr>

<td>

<div class="tipo-resumo">

<span
class="dot"
style="background:${cores[tipoAtual] || "#999"}">
</span>

${tipoAtual}

</div>

</td>

<td>
${quantidade}
</td>

<td class="total-tipo">
${formatarNumero(metragemTotal)} m
</td>

</tr>

`;

}
).join("");

}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

const busca =
buscaMetragem.value.trim();


const tipoFiltro =
filtroTipo.value;


let filtrados =
rolos.filter(
r => {

const pertenceAba =

abaAtual === "entrada"

? !r.saida_em

: !!r.saida_em;


if(!pertenceAba)
return false;


const bateMetragem =

!busca ||

String(r.metragem)
.startsWith(busca);


const bateTipo =

!tipoFiltro ||

r.tipo === tipoFiltro;


return (
bateMetragem &&
bateTipo
);

}
);


/*
Ordena pelos registros mais recentes.
*/

filtrados.sort(
(a,b) => {

const dataA =
abaAtual === "entrada"

? b.entrada_em

: b.saida_em;


const dataB =
abaAtual === "entrada"

? a.entrada_em

: a.saida_em;


return new Date(dataA) -
new Date(dataB);

}
);


/*
Estatísticas do estoque atual.
*/

const estoque =
rolos.filter(
r => !r.saida_em
);


document.getElementById(
"totalRolos"
).textContent =
estoque.length;


document.getElementById(
"totalMetros"
).textContent =

formatarNumero(
estoque.reduce(
(s,r) =>
s + Number(r.metragem),
0
)
) + " m";


/*
Contador.
*/

document.getElementById(
"count"
).textContent =

abaAtual === "entrada"

? `${filtrados.length} rolo(s) no estoque`

: `${filtrados.length} rolo(s) com saída`;


/*
Lista vazia.
*/

if(!filtrados.length){

lista.innerHTML =

abaAtual === "entrada"

? `<div class="empty">
Nenhum rolo no estoque.
</div>`

: `<div class="empty">
Nenhum rolo com saída registrada.
</div>`;

}


/*
Lista com registros.
*/

else{

lista.innerHTML =

filtrados.map(
r => `

<div class="roll">

<div class="roll-info">

<span
class="dot"
style="background:${cores[r.tipo] || "#999"}">
</span>

<div>

<div class="name">
${r.tipo}
</div>

<div class="count">
Rolo individual
</div>

<div class="date">
📥 Entrada:
${formatarData(r.entrada_em)}
</div>

${
r.saida_em

? `<div class="saida-date">
📤 Saída:
${formatarData(r.saida_em)}
</div>`

: ""
}

</div>

</div>


<div
class="roll-action"
style="
display:flex;
align-items:center;
gap:10px;
">

<span class="meters">

${formatarNumero(r.metragem)} m

</span>


${
abaAtual === "entrada"

? `<button
class="delete"
onclick="registrarSaida(${r.id})"
>
📤 Saída
</button>`

: ""

}

</div>

</div>

`
).join("");

}


renderResumo();

}


/* =====================================================
   ABAS
   ===================================================== */

function mostrarEntrada(){

abaAtual =
"entrada";


btnEntrada
.classList
.add("active");


btnSaida
.classList
.remove("active");


document.getElementById(
"tituloLista"
).textContent =
"📥 Rolos no estoque";


render();

}


function mostrarSaida(){

abaAtual =
"saida";


btnSaida
.classList
.add("active");


btnEntrada
.classList
.remove("active");


document.getElementById(
"tituloLista"
).textContent =
"📤 Rolos que saíram";


render();

}


/* =====================================================
   EVENTOS
   ===================================================== */

document.getElementById(
"add"
).addEventListener(
"click",
adicionar
);


metragem.addEventListener(
"keydown",
event => {

if(event.key === "Enter"){

adicionar();

}

}
);


buscaMetragem.addEventListener(
"input",
render
);


filtroTipo.addEventListener(
"change",
render
);


document.getElementById(
"btnEntrada"
).addEventListener(
"click",
mostrarEntrada
);


document.getElementById(
"btnSaida"
).addEventListener(
"click",
mostrarSaida
);


document.getElementById(
"recarregar"
).addEventListener(
"click",
carregarRolos
);


/* =====================================================
   INÍCIO
   ===================================================== */

carregarRolos();

</script>

</body>
</html>
```
