<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque de Rolos</title><style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#1f2937
  }

  .container{
    max-width:900px;
    margin:auto;
    padding:20px
  }

  h1{
    margin:0 0 6px;
    font-size:28px
  }

  .subtitle{
    margin:0 0 20px;
    color:#6b7280
  }

  .card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 3px 12px #00000012
  }

  .form{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:10px
  }

  label{
    font-size:13px;
    font-weight:bold;
    display:block;
    margin-bottom:6px
  }

  input,select,button{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px
  }

  button{
    border:0;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer
  }

  button:hover{
    filter:brightness(.95)
  }

  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px
  }

  .stat{
    background:#eef2ff;
    border-radius:12px;
    padding:16px
  }

  .stat strong{
    display:block;
    font-size:28px;
    margin-top:4px
  }

  .filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
  }

  /* ABAS */

  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px
  }

  .tab{
    background:#e5e7eb;
    color:#374151;
  }

  .tab.active{
    background:#2563eb;
    color:white;
  }

  .roll{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #e5e7eb
  }

  .roll:last-child{
    border-bottom:0
  }

  .roll-info{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0
  }

  .dot{
    width:18px;
    height:18px;
    border-radius:50%;
    border:1px solid #aaa;
    flex:none
  }

  .name{
    font-weight:bold
  }

  .meters{
    font-size:20px;
    font-weight:bold;
    white-space:nowrap
  }

  .delete{
    width:auto;
    padding:9px 12px;
    background:#dc2626;
    font-size:14px
  }

  .empty{
    text-align:center;
    color:#6b7280;
    padding:25px
  }

  .count{
    color:#6b7280;
    font-size:14px;
    margin-top:8px
  }

  .date{
    color:#6b7280;
    font-size:13px;
    margin-top:4px
  }

  .saida-date{
    color:#dc2626;
    font-size:13px;
    margin-top:4px
  }

  /* Resumo por tipo */

  .resumo-tabela{
    width:100%;
    border-collapse:collapse;
    margin-top:12px
  }

  .resumo-tabela th,
  .resumo-tabela td{
    padding:12px 8px;
    text-align:left;
    border-bottom:1px solid #e5e7eb
  }

  .resumo-tabela th{
    font-size:14px;
    color:#6b7280;
    font-weight:bold
  }

  .resumo-tabela td{
    font-size:15px
  }

  .resumo-tabela tr:last-child td{
    border-bottom:0
  }

  .tipo-resumo{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold
  }

  .tipo-resumo .dot{
    width:14px;
    height:14px
  }

  .total-tipo{
    font-weight:bold;
    white-space:nowrap
  }

  @media(max-width:650px){

    .form,.filters{
      grid-template-columns:1fr
    }

    .form button{
      width:100%
    }

    .roll{
      align-items:flex-start;
      flex-direction:column
    }

    .meters{
      font-size:18px
    }

    .roll-action{
      width:100%
    }

    .roll-action button{
      width:100%
    }

    .resumo-tabela th,
    .resumo-tabela td{
      padding:10px 5px;
      font-size:14px
    }

  }
</style></head><body><div class="container">  <!-- CABEÇALHO -->  <div class="card"><h1>📦 Estoque de Rolos</h1>

<p class="subtitle">
  Controle suas metragens, cores, entradas e saídas.
</p>

<div class="form">

  <div>

    <label for="tipo">
      Tipo / Cor
    </label>

    <select id="tipo">

      <option>Preto liso</option>
      <option>Preto texturado</option>
      <option>Golden</option>
      <option>Nogueira</option>
      <option>Bronze</option>
      <option>Pirita</option>
      <option>Grafite</option>

    </select>

  </div>


  <div>

    <label for="metragem">
      Metragem (m)
    </label>

    <input
      id="metragem"
      type="number"
      min="0"
      step="0.01"
      placeholder="Ex.: 530"
    >

  </div>


  <div style="align-self:end">

    <button id="add">
      ➕ Entrada
    </button>

  </div>

</div>

  </div>  <!-- ESTATÍSTICAS -->  <div class="stats"><div class="stat">

  📦 Rolos no estoque

  <strong id="totalRolos">
    0
  </strong>

</div>


<div class="stat">

  📏 Metros no estoque

  <strong id="totalMetros">
    0 m
  </strong>

</div>

  </div>  <!-- ABAS -->  <div class="tabs"><button
  id="btnEntrada"
  class="tab active"
>
  📥 Entrada
</button>


<button
  id="btnSaida"
  class="tab"
>
  📤 Saída
</button>

  </div>  <!-- BUSCA -->  <div class="card"><h2>
  🔎 Buscar
</h2>

<div class="filters">

  <input
    id="buscaMetragem"
    type="number"
    min="0"
    step="0.01"
    placeholder="Buscar por metragem..."
  >


  <select id="filtroTipo">

    <option value="">
      Todas as cores
    </option>

    <option>Preto liso</option>
    <option>Preto texturado</option>
    <option>Golden</option>
    <option>Nogueira</option>
    <option>Bronze</option>
    <option>Pirita</option>
    <option>Grafite</option>

  </select>

</div>

  </div>  <!-- LISTA -->  <div class="card"><h2 id="tituloLista">
  📥 Rolos no estoque
</h2>

<div id="lista"></div>

<div
  class="count"
  id="count"
></div>

  </div>  <!-- RESUMO -->  <div class="card"><h2>
  📊 Resumo por tipo
</h2>

<table class="resumo-tabela">

  <thead>

    <tr>
      <th>Tipo</th>
      <th>Rolos</th>
      <th>Metragem total</th>
    </tr>

  </thead>

  <tbody id="resumoTipos"></tbody>

</table>

  </div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
  "https://pipnkvlicwfraisywrzl.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_7v_jngycgXi9ZEqLYhFl8Q_FWwhcc_v";


const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let rolos = [];

let abaAtual = "entrada";


/* ==========================
   CORES
========================== */

const cores = {

  "Preto liso":"#111111",

  "Preto texturado":"#333333",

  "Golden":"#d4af37",

  "Nogueira":"#6b4226",

  "Bronze":"#cd7f32",

  "Pirita":"#8b8b83",

  "Grafite":"#555555"

};


const tipos = [

  "Preto liso",
  "Preto texturado",
  "Golden",
  "Nogueira",
  "Bronze",
  "Pirita",
  "Grafite"

];


/* ==========================
   ELEMENTOS
========================== */

const tipo =
  document.getElementById("tipo");


const metragem =
  document.getElementById("metragem");


const buscaMetragem =
  document.getElementById("buscaMetragem");


const filtroTipo =
  document.getElementById("filtroTipo");


const lista =
  document.getElementById("lista");


const resumoTipos =
  document.getElementById("resumoTipos");


const btnEntrada =
  document.getElementById("btnEntrada");


const btnSaida =
  document.getElementById("btnSaida");


/* ==========================
   FORMATAR NÚMERO
========================== */

function formatarNumero(n){

  return Number.isInteger(Number(n))

    ? String(n)

    : Number(n).toLocaleString(
        "pt-BR",
        {
          maximumFractionDigits:2
        }
      );

}


/* ==========================
   FORMATAR DATA/HORA
========================== */

function formatarData(data){

  if(!data){
    return "—";
  }


  const d = new Date(data);


  if(isNaN(d.getTime())){
    return "—";
  }


  return d.toLocaleString(
    "pt-BR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* ==========================
   CARREGAR DO SUPABASE
========================== */

async function carregarRolos(){

  const { data, error } =
    await supabase
      .from("rolos")
      .select("*")
      .order(
        "entrada_em",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    alert(
      "Erro ao carregar os rolos."
    );

    return;

  }


  rolos = data || [];


  render();

}


/* ==========================
   ADICIONAR ENTRADA
========================== */

async function adicionar(){

  const valor =
    Number(metragem.value);


  if(
    !Number.isFinite(valor) ||
    valor <= 0
  ){

    alert(
      "Digite uma metragem válida."
    );

    metragem.focus();

    return;

  }


  const { error } =
    await supabase
      .from("rolos")
      .insert([

        {

          tipo:tipo.value,

          metragem:valor,

          entrada_em:new Date().toISOString(),

          saida_em:null

        }

      ]);


  if(error){

    console.error(error);

    alert(
      "Erro ao registrar a entrada."
    );

    return;

  }


  metragem.value = "";

  metragem.focus();


  await carregarRolos();

}


/* ==========================
   REGISTRAR SAÍDA
========================== */

async function registrarSaida(id){

  const rolo =
    rolos.find(
      r => r.id === id
    );


  if(!rolo) return;


  const confirmar =
    confirm(

      `Registrar saída do rolo de ${formatarNumero(rolo.metragem)} m — ${rolo.tipo}?`

    );


  if(!confirmar){
    return;
  }


  const { error } =
    await supabase
      .from("rolos")
      .update({

        saida_em:
          new Date().toISOString()

      })
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    alert(
      "Erro ao registrar a saída."
    );

    return;

  }


  await carregarRolos();

}


/* ==========================
   RESUMO POR TIPO
========================== */

function renderResumo(){

  /*
    O resumo mostra somente
    aquilo que ainda está
    no estoque.
  */

  const estoque =
    rolos.filter(
      r => !r.saida_em
    );


  resumoTipos.innerHTML =
    tipos.map(tipoAtual => {

      const rolosTipo =
        estoque.filter(
          r => r.tipo === tipoAtual
        );


      const quantidade =
        rolosTipo.length;


      const metragemTotal =
        rolosTipo.reduce(

          (s,r) =>
            s + Number(r.metragem),

          0

        );


      return `

        <tr>

          <td>

            <div class="tipo-resumo">

              <span
                class="dot"
                style="background:${cores[tipoAtual] || "#999"}"
              ></span>

              ${tipoAtual}

            </div>

          </td>


          <td>
            ${quantidade}
          </td>


          <td class="total-tipo">
            ${formatarNumero(metragemTotal)} m
          </td>

        </tr>

      `;

    }).join("");

}


/* ==========================
   RENDERIZAR LISTA
========================== */

function render(){

  const busca =
    buscaMetragem.value.trim();


  const tipoFiltro =
    filtroTipo.value;


  /*
    Define se estamos
    mostrando entrada
    ou saída.
  */

  let filtrados =
    rolos.filter(r => {

      const estaNaEntrada =
        !r.saida_em;


      const estaNaSaida =
        !!r.saida_em;


      const pertenceAba =
        abaAtual === "entrada"
          ? estaNaEntrada
          : estaNaSaida;


      if(!pertenceAba){
        return false;
      }


      const bateMetragem =
        !busca ||
        String(r.metragem)
          .startsWith(busca);


      const bateTipo =
        !tipoFiltro ||
        r.tipo === tipoFiltro;


      return (
        bateMetragem &&
        bateTipo
      );

    });


  /*
    Entrada:
    mais recentes primeiro.

    Saída:
    saídas mais recentes primeiro.
  */

  filtrados.sort(
    (a,b) => {

      if(abaAtual === "entrada"){

        return new Date(b.entrada_em)
          - new Date(a.entrada_em);

      }


      return new Date(b.saida_em)
        - new Date(a.saida_em);

    }
  );


  /*
    Estatísticas do estoque atual.
  */

  const estoque =
    rolos.filter(
      r => !r.saida_em
    );


  document
    .getElementById("totalRolos")
    .textContent =
      estoque.length;


  document
    .getElementById("totalMetros")
    .textContent =

      formatarNumero(

        estoque.reduce(
          (s,r) =>
            s + Number(r.metragem),

          0
        )

      ) + " m";


  /*
    Contador da aba.
  */

  document
    .getElementById("count")
    .textContent =

      abaAtual === "entrada"

        ? `${filtrados.length} rolo(s) no estoque`

        : `${filtrados.length} rolo(s) com saída`;


  /*
    Lista vazia.
  */

  if(!filtrados.length){

    lista.innerHTML =

      abaAtual === "entrada"

        ? '<div class="empty">Nenhum rolo no estoque.</div>'

        : '<div class="empty">Nenhum rolo com saída registrada.</div>';

  }


  else {

    lista.innerHTML =

      filtrados.map(r => `

        <div class="roll">

          <div class="roll-info">

            <span
              class="dot"
              style="background:${cores[r.tipo] || "#999"}"
            ></span>


            <div>

              <div class="name">
                ${r.tipo}
              </div>


              <div class="count">
                Rolo individual
              </div>


              <div class="date">
                📥 Entrada:
                ${formatarData(r.entrada_em)}
              </div>


              ${
                r.saida_em

                  ? `

                    <div class="saida-date">
                      📤 Saída:
                      ${formatarData(r.saida_em)}
                    </div>

                  `

                  : ""

              }

            </div>

          </div>


          <div
            class="roll-action"
            style="
              display:flex;
              align-items:center;
              gap:10px
            "
          >

            <span class="meters">
              ${formatarNumero(r.metragem)} m
            </span>


            ${
              abaAtual === "entrada"

                ? `

                  <button
                    class="delete"
                    onclick="registrarSaida(${r.id})"
                  >
                    📤 Saída
                  </button>

                `

                : ""

            }

          </div>

        </div>

      `).join("");

  }


  renderResumo();

}


/* ==========================
   TROCAR PARA ENTRADA
========================== */

function mostrarEntrada(){

  abaAtual = "entrada";


  btnEntrada.classList.add(
    "active"
  );


  btnSaida.classList.remove(
    "active"
  );


  document
    .getElementById("tituloLista")
    .textContent =
      "📥 Rolos no estoque";


  render();

}


/* ==========================
   TROCAR PARA SAÍDA
========================== */

function mostrarSaida(){

  abaAtual = "saida";


  btnSaida.classList.add(
    "active"
  );


  btnEntrada.classList.remove(
    "active"
  );


  document
    .getElementById("tituloLista")
    .textContent =
      "📤 Rolos que saíram";


  render();

}


/* ==========================
   EVENTOS
========================== */

document
  .getElementById("add")
  .addEventListener(
    "click",
    adicionar
  );


metragem.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){

      adicionar();

    }

  }
);


buscaMetragem.addEventListener(
  "input",
  render
);


filtroTipo.addEventListener(
  "change",
  render
);


btnEntrada.addEventListener(
  "click",
  mostrarEntrada
);


btnSaida.addEventListener(
  "click",
  mostrarSaida
);


/* ==========================
   INICIAR
========================== */

carregarRolos();

</script></body>
</html>
